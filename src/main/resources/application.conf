# Application Metadata
app {
  name = "FacilityManagementSystem"
  version = "1.0.0"
  description = "A facility management system for handling bookings, guests, rooms, and notifications."
}

# Custom Router
play.http.router = "main.DayWiseTasks.CaseStudies.CaseStudy1.controllers.CustomRouter"

# Secret Key (Replace in Production)
play.http.secret.key = "changeme-please-set-a-secure-key"

# Server Settings
play.server {
  http {
    port = 9000
    idleTimeout = 75s
  }
}

# Logging Configuration
logger {
  root = INFO
  play = DEBUG
  application = DEBUG
}

# Database Configuration (H2 Example)
db.default {
  driver = org.h2.Driver
  url = "jdbc:h2:mem:play"
  username = "sa"
  password = ""
  hikaricp {
    connectionTimeout = 30000
    maxLifetime = 1800000
    maximumPoolSize = 10
  }
}

# MongoDB Configuration (Optional)
mongodb {
  uri = "mongodb://localhost:27017"
  database = "facility_management_system"
}

# Email Settings
play.mailer {
  host = "smtp.gmail.com"
  port = 587
  ssl = false
  tls = true
  user = "your-email@gmail.com"
  password = "your-email-password"
  from = "no-reply@facilitymanagement.com"
}

# CORS Configuration
play.filters.cors {
  pathPrefixes = ["/"]
  allowedOrigins = ["http://localhost:3000"]
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE"]
  allowedHttpHeaders = ["Accept", "Content-Type", "Authorization"]
}

# API Response Defaults
api.response {
  defaultLimit = 100
  maxLimit = 500
}

# Akka Configuration
akka {
  loglevel = "INFO"
  actor {
    provider = "local"
  }
}

# Play Filters
play.filters {
  enabled += "play.filters.headers.SecurityHeadersFilter"
  enabled += "play.filters.csrf.CSRFFilter"
}

# Custom Configurations
custom.config {
  app.environment = "local"
  app.description = "Handles room booking, guest management, and notifications efficiently."
}

# HTTP Request Timeout
play.http.timeout.request = 20s
